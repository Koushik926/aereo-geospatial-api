version: "3.9"

services:
  api:
    build: ..
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./aereo.db
      - REDIS_URL=redis://redis:6379/0
      - LOG_LEVEL=INFO
    volumes:
      - uploads:/tmp/aereo_uploads
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  uploads:
